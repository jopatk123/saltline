# 依赖 http 块里有这个 map（杭州机现有 nginx.conf 已经因为 bomberman 加过）：
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl;
    http2 on;
    server_name saltline.jopatk.top;

    ssl_certificate     /etc/letsencrypt/live/saltline.jopatk.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saltline.jopatk.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 健康检查：普通 GET，不进 WS 分支，所以 HTTP/2 下也能用
    location = /healthz {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        access_log off;
    }

    # WebSocket 中继
    location /ws {
        proxy_pass http://127.0.0.1:9090/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 静态页只用于自测；正式入口在 B 站小玩具
    location / {
        root /var/www/saltline.jopatk.top;
        try_files $uri $uri/ =404;
    }
}
